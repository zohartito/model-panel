name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

  pull-requests: read
jobs:
  test:
    name: unittest (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

        fetch-depth: 0
    - name: Run gitleaks
      if: ${{ matrix.python == '3.12' }}
      uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
      env:
          # No GITLEAKS_LICENSE needed: gitleaks-action is free for personal
          # (non-organization) GitHub accounts.
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python }}

    - name: Check Python syntax
      run: python -m compileall -q skills tests

      # The suite is stdlib-only by design (every seat is faked, no real
      # model calls), so there is nothing to pip install here.
    - name: Run unittest suite
      env:
        PYTHONUNBUFFERED: "1"
      run: python -m unittest discover -s tests -v
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
